name: sayanati_app
description: "تطبيق صيانتي — إدارة الصيانة والإنتاج والسلامة"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # التواصل مع سيرفر صيانتي المحلي (Node.js + PostgreSQL) عبر REST مباشرة
  # (راجع lib/services/api_client.dart) — بدون أي حزمة إضافية غير http نفسها.
  http: ^1.2.2
  shared_preferences: ^2.3.2

  # توليد تقارير PDF عربية (تقرير بلاغ الصيانة) بالاعتماد على محرك عرض
  # النظام نفسه، فيظهر النص العربي بشكل سليم دون أي خط خاص.
  printing: ^5.13.4

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # يولّد أيقونة تطبيق أندرويد الفعلية (بدل أيقونة Flutter الافتراضية)
  # من assets/images/app_icon.png أثناء البناء على GitHub Actions —
  # راجع خطوة "توليد أيقونة التطبيق" في .github/workflows.
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/images/

# إعداد flutter_launcher_icons — يُستخدم فقط أثناء البناء (لا يغيّر شيئًا في
# التطبيق نفسه وقت التشغيل)، لتوليد كل أحجام أيقونة أندرويد المطلوبة من صورة
# واحدة مربعة عالية الدقة.
flutter_launcher_icons:
  android: "ic_launcher"
  min_sdk_android: 21
  image_path: "assets/images/app_icon.png"
