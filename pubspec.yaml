name: sayanati_app
description: "تطبيق صيانتي — إدارة الصيانة والإنتاج والسلامة"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # التواصل مع سيرفر صيانتي المحلي (Node.js + PostgreSQL) عبر REST مباشرة
  # (راجع lib/services/api_client.dart) — بدون أي حزمة إضافية غير http نفسها.
  http: ^1.2.2
  shared_preferences: ^2.3.2

  # توليد تقارير PDF عربية (تقرير بلاغ الصيانة) بالاعتماد على محرك عرض
  # النظام نفسه، فيظهر النص العربي بشكل سليم دون أي خط خاص.
  printing: ^5.13.4

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: false

  # فعّل هذا القسم بعد إضافة الشعارات الفعلية إلى assets/images
  # assets:
  #   - assets/images/
