name: sayanati_app
description: "تطبيق صيانتي — إدارة الصيانة والإنتاج والسلامة"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # التواصل مع سيرفر صيانتي المحلي (Node.js + PostgreSQL) عبر REST مباشرة
  # (راجع lib/services/api_client.dart) — بدون أي حزمة إضافية غير http نفسها.
  http: ^1.2.2
  shared_preferences: ^2.3.2

  # تسجيل الدخول عبر جوجل — يحتاج معرّف عميل (Client ID) يُضبط من السيرفر
  # نفسه (site_settings) فلا يحتاج هذا الملف أي تعديل لاحقًا. راجع
  # lib/services/auth_service.dart لتفاصيل الاستخدام.
  google_sign_in: ^6.2.1

  # توليد تقارير PDF عربية (تقرير بلاغ الصيانة) بالاعتماد على محرك عرض
  # النظام نفسه، فيظهر النص العربي بشكل سليم دون أي خط خاص.
  printing: ^5.13.4

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2

  # التقاط/اختيار صورة معدات تصريح العمل (تصاريح السلامة) — تعمل على
  # أندرويد وويب من نفس الكود، وتحوَّل الصورة إلى base64 قبل إرسالها للسيرفر
  # (راجع lib/screens/safety/safety_permit_request_screen.dart). لا تحتاج أي
  # إذن يدوي على الويب أو عند اختيار صورة من المعرض على أندرويد؛ إذن الكاميرا
  # على أندرويد يُضاف تلقائيًا ضمن بناء CI (راجع .github/workflows/build-apk.yml).
  image_picker: ^1.1.2
    # إشعارات Push حقيقية عبر Firebase Cloud Messaging (بصوت وفي شريط
  # إشعارات الجوال، حتى لو كان التطبيق مغلقًا) — للأندرويد والويب معًا.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # إظهار الإشعار في شريط الإشعارات مع صوت أثناء استخدام التطبيق فعليًا
  # (أندرويد فقط؛ FCM يعرضها تلقائيًا في الخلفية بدون هذه الحزمة).
  flutter_local_notifications: ^18.0.1

  # الدخول بالبصمة (اختياري، يفعّله المستخدم بنفسه) — يفتح جلسة دخول محفوظة
  # مسبقًا على هذا الجهاز بدل كتابة كلمة المرور في كل مرة، على أندرويد فقط.
  # راجع lib/services/biometric_service.dart. يتطلب MainActivity من نوع
  # FlutterFragmentActivity بدل FlutterActivity، وحد أدنى Android SDK 23 —
  # كلاهما يُضبط تلقائيًا ضمن بناء CI لأن مجلد android/ يُولَّد من جديد في كل
  # مرة (راجع .github/workflows/build-apk.yml).
  local_auth: ^2.3.0

  # فتح صورة بلاغ العطل (المحفوظة كملف عادي على السيرفر) في المتصفح/تطبيق
  # خارجي عند طلب "تنزيل الصورة" — على أندرويد يفتحها المتصفح فيقدر المستخدم
  # يضغط عليها مطوّلًا ليحفظها في المعرض، وعلى الويب تُفتح في تبويب جديد
  # فيقدر يحفظها بالطريقة العادية (كليك يمين ← حفظ الصورة).
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # يولّد أيقونة تطبيق أندرويد الفعلية (بدل أيقونة Flutter الافتراضية)
  # من assets/images/app_icon.png أثناء البناء على GitHub Actions —
  # راجع خطوة "توليد أيقونة التطبيق" في .github/workflows.
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/images/

# إعداد flutter_launcher_icons — يُستخدم فقط أثناء البناء (لا يغيّر شيئًا في
# التطبيق نفسه وقت التشغيل)، لتوليد كل أحجام أيقونة أندرويد المطلوبة من صورة
# واحدة مربعة عالية الدقة.
flutter_launcher_icons:
  android: "ic_launcher"
  min_sdk_android: 23
  image_path: "assets/images/app_icon.png"
