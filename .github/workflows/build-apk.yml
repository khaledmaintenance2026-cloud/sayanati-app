name: بناء تطبيق صيانتي (Android APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout الكود
        uses: actions/checkout@v4

      # مهم لتسجيل الدخول عبر جوجل: بدون هذه الخطوة يُنشئ Gradle مفتاح توقيع
      # عشوائيًا جديدًا في كل تشغيل (لأن مجلد android/ نفسه يُولَّد من جديد
      # كل مرة أسفل)، فيتغيّر "SHA-1 Fingerprint" باستمرار ويكسر تسجيل الدخول
      # عبر جوجل بعد كل تحديث. نستعيد هنا مفتاحًا ثابتًا محفوظًا كـ Secret
      # بدل تركه يتولّد عشوائيًا، فيبقى نفسه إلى الأبد. لو لم يُضبط الـ Secret
      # بعد (أول تشغيل بعد هذا التحديث) يستمر البناء بمفتاح عشوائي كالمعتاد
      # فقط مع تنبيه في السجل.
      - name: استعادة مفتاح توقيع ثابت (لتسجيل الدخول عبر جوجل)
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$ANDROID_DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "تم استخدام مفتاح التوقيع الثابت المحفوظ في GitHub Secrets."
          else
            echo "تنبيه: ANDROID_DEBUG_KEYSTORE_B64 غير مضبوط — سيُستخدم مفتاح عشوائي جديد لهذا البناء."
          fi

      # خطوة تشخيص مؤقتة: تطبع بصمة SHA-1 الفعلية للمفتاح المستخدم فعليًا في
      # هذا البناء، لمقارنتها يدويًا ببصمة عميل Android المسجّلة في Google
      # Cloud Console والتأكد من تطابقهما تمامًا. تُحذف لاحقًا بعد التأكد.
      - name: طباعة بصمة SHA-1 الفعلية للتأكد (خطوة تشخيص مؤقتة)
        run: |
          echo "بصمة SHA-1 الفعلية لمفتاح التوقيع المستخدم في هذا البناء:"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | grep "SHA1:"

      # (أُضيفت بعد فحص أمني) الـ APK الموسوم "release" كان يُبنى ويُوقَّع فعليًا
      # بمفتاح Android Debug القياسي (نفس مفتاح الاختبار أعلاه) — غير مقبول
      # لتطبيق يُوزَّع فعليًا على المستخدمين. هذه الخطوة تستعيد مفتاح توقيع
      # إصدار حقيقي منفصل من GitHub Secrets وتكتب key.properties له. لو لم
      # يُضبط الـ Secret بعد فلن يُنشأ الملف، وتستمر خطوة التوقيع أدناه
      # بالسلوك القديم (توقيع بمفتاح Debug) تلقائيًا دون كسر البناء — أضيفوا
      # ANDROID_RELEASE_KEYSTORE_B64 و ANDROID_RELEASE_KEYSTORE_PASSWORD كـ
      # Secrets لتفعيلها (راجع تقرير فحص الثغرات لخطوات التوليد الكاملة).
      - name: استعادة مفتاح توقيع الإصدار الحقيقي (Release Keystore) — إن توفّر
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_RELEASE_KEYSTORE_B64" ] && [ -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sayanati-release.jks"
            cat > "$RUNNER_TEMP/key.properties" <<PROPS
          storeFile=$RUNNER_TEMP/sayanati-release.jks
          storePassword=$ANDROID_RELEASE_KEYSTORE_PASSWORD
          keyAlias=sayanati_release
          keyPassword=$ANDROID_RELEASE_KEYSTORE_PASSWORD
          PROPS
            echo "تم إعداد مفتاح توقيع الإصدار الحقيقي — سيُستخدم بدل مفتاح Debug."
            echo "بصمة SHA-1 لمفتاح الإصدار الحقيقي (سجّلوها في Google Cloud Console):"
            keytool -list -v -keystore "$RUNNER_TEMP/sayanati-release.jks" -alias sayanati_release -storepass "$ANDROID_RELEASE_KEYSTORE_PASSWORD" 2>/dev/null | grep "SHA1:"
          else
            echo "تنبيه: ANDROID_RELEASE_KEYSTORE_B64/ANDROID_RELEASE_KEYSTORE_PASSWORD غير مضبوطين — سيستمر توقيع نسخة release بمفتاح Debug مؤقتًا (غير آمن للإنتاج)."
          fi

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: توليد مجلد Android الأصلي (بدون المساس بـ lib أو pubspec)
        run: flutter create --platforms=android --org com.sayanati --project-name sayanati_app .

      # مجلد android/ يُولَّد من جديد بالكامل في كل بناء (الخطوة أعلاه)، لذا لا
      # يمكن إضافة إذن الكاميرا مباشرة في ملف AndroidManifest.xml داخل الكود
      # المرفوع — يُضاف هنا بعد كل توليد بدل ذلك. يحتاجه image_picker عند
      # التقاط صورة معدات تصريح سلامة بالكاميرا مباشرة (اختيار صورة من
      # المعرض لا يحتاج أي إذن إضافي، الحزمة تتولاه تلقائيًا).
      - name: إضافة إذن الكاميرا لصور تصاريح السلامة
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml

      # (أُضيفت بعد فحص أمني) تعطيل النسخ الاحتياطي التلقائي لأندرويد
      # (adb backup / النسخ الاحتياطي السحابي لجوجل) — بدونه يمكن استخراج بيانات
      # التطبيق (بما فيها رمز الدخول قبل نقله للتخزين المشفّر) من نسخة احتياطية
      # على أجهزة قديمة أو عبر ADB بلا حاجة لصلاحية Root. راجع تقرير فحص الثغرات.
      - name: تعطيل النسخ الاحتياطي التلقائي (allowBackup)
        run: |
          sed -i '0,/<application/{s#<application#<application\n        android:allowBackup="false"#}' android/app/src/main/AndroidManifest.xml
          grep -A1 "<application" android/app/src/main/AndroidManifest.xml | head -3

      # حزمة local_auth (الدخول بالبصمة) تتطلب أن يكون MainActivity من نوع
      # FlutterFragmentActivity بدل FlutterActivity الافتراضي، وإذن
      # USE_BIOMETRIC في AndroidManifest.xml. بما أن مجلد android/ يُولَّد من
      # جديد في كل بناء (الخطوة أعلاه)، نطبّق التعديلين هنا تلقائيًا بعد كل
      # توليد بدل تعديلهما يدويًا في الكود.
      - name: تفعيل دعم الدخول بالبصمة (MainActivity + إذن USE_BIOMETRIC)
        run: |
          MAINACT=android/app/src/main/kotlin/com/sayanati/sayanati_app/MainActivity.kt
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$MAINACT"
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' android/app/src/main/AndroidManifest.xml
          echo "--- محتوى MainActivity.kt بعد التعديل ---"
          cat "$MAINACT"

      # حزمة flutter_local_notifications (إشعارات صوتية في شريط الجوال) تتطلب
      # تفعيل "Core Library Desugaring" في إعدادات Gradle، وإلا يفشل البناء
      # بالكامل. بما أن مجلد android/ يُولَّد من جديد في كل مرة (الخطوة أعلاه)،
      # نضيف هذا التفعيل هنا تلقائيًا بعد كل توليد بدل تعديله يدويًا في الكود.
      # كذلك نرفع الحد الأدنى لإصدار أندرويد (minSdk) إلى 23 في نفس الخطوة —
      # مطلوب من حزمة local_auth (الدخول بالبصمة) ولا يعمل البناء بدونه.
      - name: تفعيل Core Library Desugaring ورفع الحد الأدنى لإصدار أندرويد
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            GFILE=android/app/build.gradle.kts
            sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' "$GFILE"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$GFILE"
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$GFILE"
          else
            GFILE=android/app/build.gradle
            sed -i '/compileOptions {/a\        coreLibraryDesugaringEnabled true' "$GFILE"
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$GFILE"
            printf '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n' >> "$GFILE"
          fi
          echo "--- محتوى ملف Gradle بعد التعديل ---"
          cat "$GFILE"

      # (أُضيفت بعد فحص أمني) تربط نسخة release بمفتاح التوقيع الحقيقي أعلاه
      # بدل مفتاح Debug — لا تفعل شيئًا لو لم يُضبط الـ Secret بعد (راجع خطوة
      # "استعادة مفتاح توقيع الإصدار الحقيقي" أعلاه)، فيستمر البناء بسلوكه
      # القديم تلقائيًا دون كسر شيء.
      - name: ربط نسخة release بمفتاح التوقيع الحقيقي — إن توفّر
        run: |
          if [ -f "$RUNNER_TEMP/key.properties" ]; then
            if [ -f android/app/build.gradle.kts ]; then
              GFILE=android/app/build.gradle.kts
              sed -i "1i import java.util.Properties\nimport java.io.FileInputStream\nval sayanatiKeyProps = Properties().apply { load(FileInputStream(\"$RUNNER_TEMP/key.properties\")) }" "$GFILE"
              sed -i '/^android {/a\    signingConfigs {\n        create("release") {\n            storeFile = file(sayanatiKeyProps["storeFile"] as String)\n            storePassword = sayanatiKeyProps["storePassword"] as String\n            keyAlias = sayanatiKeyProps["keyAlias"] as String\n            keyPassword = sayanatiKeyProps["keyPassword"] as String\n        }\n    }' "$GFILE"
              sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/' "$GFILE"
            else
              GFILE=android/app/build.gradle
              sed -i "1i def sayanatiKeyProps = new Properties()\nsayanatiKeyProps.load(new FileInputStream(file(\"$RUNNER_TEMP/key.properties\")))" "$GFILE"
              sed -i '/^android {/a\    signingConfigs {\n        release {\n            storeFile file(sayanatiKeyProps["storeFile"])\n            storePassword sayanatiKeyProps["storePassword"]\n            keyAlias sayanatiKeyProps["keyAlias"]\n            keyPassword sayanatiKeyProps["keyPassword"]\n        }\n    }' "$GFILE"
              sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' "$GFILE"
            fi
            echo "--- محتوى ملف Gradle بعد ربط مفتاح الإصدار ---"
            cat "$GFILE"
          else
            echo "لا يوجد مفتاح إصدار حقيقي مُعد بعد — نسخة release ستبقى موقّعة بمفتاح Debug كالسابق."
          fi

      - name: تحميل الحزم
        run: flutter pub get

      - name: توليد أيقونة التطبيق من الشعار الفعلي (assets/images/app_icon.png)
        run: dart run flutter_launcher_icons

      - name: فحص الكود
        run: flutter analyze || true

      - name: بناء APK (نسخة تجريبية قابلة للتثبيت فورًا)
        run: flutter build apk --debug

      # موقّعة بمفتاح الإصدار الحقيقي لو أُضيف الـ Secret (راجع الخطوات أعلاه)،
      # وإلا فبمفتاح Debug مؤقتًا كالسابق.
      - name: بناء APK (نسخة release)
        continue-on-error: true
        run: flutter build apk --release

      - name: رفع APK كملف تحميل (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sayanati-app-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
          if-no-files-found: warn

      # رابط تحميل مباشر وثابت (لا يحتاج تسجيل دخول GitHub ولا فك ضغط) —
      # مناسب لفتحه مباشرة من متصفح الجوال وتثبيت APK فورًا.
      - name: نشر رابط تحميل مباشر وثابت
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: أحدث نسخة من تطبيق صيانتي (APK)
          body: يُحدَّث تلقائيًا مع كل رفع كود جديد. افتح هذه الصفحة من متصفح جوالك وحمّل app-release.apk (أو app-debug.apk) مباشرة.
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
