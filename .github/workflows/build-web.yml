name: بناء نسخة الويب (PWA) من تطبيق صيانتي

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout الكود
        uses: actions/checkout@v4

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: توليد مجلد الويب الأصلي (بدون المساس بـ lib أو pubspec)
        run: flutter create --platforms=web --org com.sayanati --project-name sayanati_app .

      - name: تحميل الحزم
        run: flutter pub get

      - name: تخصيص صفحة الويب الرئيسية (عنوان عربي، RTL، أيقونة التطبيق، ودعم WebAuthn للبصمة)
        run: |
          cat > web/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <base href="/app/">
            <meta charset="UTF-8">
            <meta content="IE=Edge" http-equiv="X-UA-Compatible">
            <meta name="description" content="نظام صيانتي لإدارة الصيانة والإنتاج والسلامة - الماس للعطور">
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-status-bar-style" content="black">
            <meta name="apple-mobile-web-app-title" content="صيانتي">
            <link rel="apple-touch-icon" href="icons/Icon-192.png">
            <link rel="icon" type="image/png" href="favicon.png"/>
            <title>صيانتي</title>
            <link rel="manifest" href="manifest.json">
          </head>
          <body>
            <script>
              // دعم الدخول بالبصمة/Face ID على متصفح الويب عبر WebAuthn القياسية —
              // تعمل فقط على رابط HTTPS آمن. قفل جهاز محلي إضافي فوق جلسة دخول
              // موجودة أصلًا (بدون تحقق مع أي سيرفر)، بنفس فلسفة نسخة أندرويد.
              (function () {
                function b64urlEncode(buffer) {
                  const bytes = new Uint8Array(buffer);
                  let str = '';
                  for (let i = 0; i < bytes.byteLength; i++) str += String.fromCharCode(bytes[i]);
                  return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
                }
                function b64urlDecode(str) {
                  str = str.replace(/-/g, '+').replace(/_/g, '/');
                  while (str.length % 4) str += '=';
                  const bin = atob(str);
                  const bytes = new Uint8Array(bin.length);
                  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                  return bytes;
                }
                window.sayanatiWebAuthnSupported = async function () {
                  try {
                    if (!window.PublicKeyCredential) return false;
                    if (typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable !== 'function') return false;
                    return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
                  } catch (e) {
                    return false;
                  }
                };
                window.sayanatiWebAuthnRegister = async function (userId, userName) {
                  try {
                    const challenge = new Uint8Array(32);
                    crypto.getRandomValues(challenge);
                    const userIdBytes = new TextEncoder().encode(String(userId));
                    const cred = await navigator.credentials.create({
                      publicKey: {
                        challenge: challenge,
                        rp: { name: 'صيانتي' },
                        user: { id: userIdBytes, name: String(userName), displayName: String(userName) },
                        pubKeyCredParams: [
                          { type: 'public-key', alg: -7 },
                          { type: 'public-key', alg: -257 }
                        ],
                        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
                        timeout: 60000,
                        attestation: 'none'
                      }
                    });
                    if (!cred) return null;
                    return b64urlEncode(cred.rawId);
                  } catch (e) {
                    console.log('WebAuthn register error: ' + e);
                    return null;
                  }
                };
                window.sayanatiWebAuthnAuthenticate = async function (credentialIdB64) {
                  try {
                    const idBytes = b64urlDecode(credentialIdB64);
                    const challenge = new Uint8Array(32);
                    crypto.getRandomValues(challenge);
                    const assertion = await navigator.credentials.get({
                      publicKey: {
                        challenge: challenge,
                        allowCredentials: [{ id: idBytes, type: 'public-key' }],
                        userVerification: 'required',
                        timeout: 60000
                      }
                    });
                    return !!assertion;
                  } catch (e) {
                    console.log('WebAuthn authenticate error: ' + e);
                    return false;
                  }
                };
              })();
            </script>
            <script src="flutter_bootstrap.js" async></script>
          </body>
          </html>
          HTMLEOF

      - name: تخصيص ملف Manifest (اسم التطبيق وألوانه)
        run: |
          cat > web/manifest.json <<'JSONEOF'
          {
              "name": "صيانتي",
              "short_name": "صيانتي",
              "start_url": "/app/",
              "display": "standalone",
              "background_color": "#F7F8FA",
              "theme_color": "#2B3487",
              "description": "نظام صيانتي لإدارة الصيانة والإنتاج والسلامة - الماس للعطور",
              "orientation": "portrait-primary",
              "prefer_related_applications": false,
              "icons": [
                  { "src": "icons/Icon-192.png", "sizes": "192x192", "type": "image/png" },
                  { "src": "icons/Icon-512.png", "sizes": "512x512", "type": "image/png" },
                  { "src": "icons/Icon-maskable-192.png", "sizes": "192x192", "type": "image/png", "purpose": "maskable" },
                  { "src": "icons/Icon-maskable-512.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable" }
              ]
          }
          JSONEOF

      - name: توليد أيقونات الويب من الشعار الفعلي
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          convert assets/images/app_icon.png -resize 192x192 web/icons/Icon-192.png
          convert assets/images/app_icon.png -resize 512x512 web/icons/Icon-512.png
          convert assets/images/app_icon.png -resize 192x192 web/icons/Icon-maskable-192.png
          convert assets/images/app_icon.png -resize 512x512 web/icons/Icon-maskable-512.png
          convert assets/images/app_icon.png -resize 32x32 web/favicon.png

      - name: بناء نسخة الويب
        run: flutter build web --release --pwa-strategy=none

      - name: ضغط ناتج البناء في ملف واحد (باسم يتضمن رقم الكوميت لتفادي أي كاش قديم)
        run: |
          cd build/web
          zip -r "../../sayanati-web-${GITHUB_SHA::7}.zip" .

      - name: حذف الملفات المرفقة القديمة من الإصدار
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view web-latest --json assets --jq '.assets[].name' 2>/dev/null | \
            xargs -r -I{} gh release delete-asset web-latest {} -y --repo "${GITHUB_REPOSITORY}" || true

      - name: نشر رابط تحميل ثابت لملف نسخة الويب
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-latest
          name: أحدث نسخة من نسخة الويب (PWA) لتطبيق صيانتي
          body: |
            يُحدَّث تلقائيًا مع كل رفع كود جديد. اسم الملف المرفق يتغيّر في كل مرة
            (رقم الكوميت في نهاية الاسم) عن قصد — لتفادي أي تخزين مؤقت قديم من
            المتصفح أو الشبكة على نفس الرابط. حمّل الملف المرفق هنا (الوحيد
            الموجود دائمًا)، وفكّه داخل مجلد public-app بجانب مجلد public على
            سيرفر صيانتي، ثم أعد تشغيل الخدمة.
          make_latest: false
          files: sayanati-web-*.zip
