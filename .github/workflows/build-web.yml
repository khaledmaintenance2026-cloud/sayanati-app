name: بناء نسخة الويب (PWA) من تطبيق صيانتي

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout الكود
        uses: actions/checkout@v4

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: توليد مجلد الويب الأصلي (بدون المساس بـ lib أو pubspec)
        run: flutter create --platforms=web --org com.sayanati --project-name sayanati_app .

      - name: تحميل الحزم
        run: flutter pub get

      # نستبدل صفحة الويب الافتراضية (إنجليزية LTR بأيقونة فلتر العامة)
      # بنسخة عربية RTL بعنوان واسم التطبيق الحقيقيين. تُكتب من جديد في كل
      # بناء (نفس فلسفة مجلد android/ — لا تُعدَّل هذه الملفات يدويًا أبدًا).
      - name: تخصيص صفحة الويب الرئيسية (عنوان عربي، RTL، أيقونة التطبيق)
        run: |
          cat > web/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <base href="/app/">
            <meta charset="UTF-8">
            <meta content="IE=Edge" http-equiv="X-UA-Compatible">
            <meta name="description" content="نظام صيانتي لإدارة الصيانة والإنتاج والسلامة - الماس للعطور">
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-status-bar-style" content="black">
            <meta name="apple-mobile-web-app-title" content="صيانتي">
            <link rel="apple-touch-icon" href="icons/Icon-192.png">
            <link rel="icon" type="image/png" href="favicon.png"/>
            <title>صيانتي</title>
            <link rel="manifest" href="manifest.json">
          </head>
          <body>
            <script src="flutter_bootstrap.js" async></script>
          </body>
          </html>
          HTMLEOF

      - name: تخصيص ملف Manifest (اسم التطبيق وألوانه)
        run: |
          cat > web/manifest.json <<'JSONEOF'
          {
              "name": "صيانتي",
              "short_name": "صيانتي",
              "start_url": "/app/",
              "display": "standalone",
              "background_color": "#F7F8FA",
              "theme_color": "#2B3487",
              "description": "نظام صيانتي لإدارة الصيانة والإنتاج والسلامة - الماس للعطور",
              "orientation": "portrait-primary",
              "prefer_related_applications": false,
              "icons": [
                  { "src": "icons/Icon-192.png", "sizes": "192x192", "type": "image/png" },
                  { "src": "icons/Icon-512.png", "sizes": "512x512", "type": "image/png" },
                  { "src": "icons/Icon-maskable-192.png", "sizes": "192x192", "type": "image/png", "purpose": "maskable" },
                  { "src": "icons/Icon-maskable-512.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable" }
              ]
          }
          JSONEOF

      # نولّد أيقونات الويب من نفس شعار التطبيق الفعلي (assets/images/app_icon.png)
      # بدل ترك أيقونة فلتر الافتراضية — تمامًا كخطوة توليد أيقونة أندرويد.
      - name: توليد أيقونات الويب من الشعار الفعلي
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          convert assets/images/app_icon.png -resize 192x192 web/icons/Icon-192.png
          convert assets/images/app_icon.png -resize 512x512 web/icons/Icon-512.png
          convert assets/images/app_icon.png -resize 192x192 web/icons/Icon-maskable-192.png
          convert assets/images/app_icon.png -resize 512x512 web/icons/Icon-maskable-512.png
          convert assets/images/app_icon.png -resize 32x32 web/favicon.png

      # لا نستخدم خيار --base-href هنا لأننا كتبنا المسار "/app/" مباشرة
      # وبشكل ثابت داخل <base href="/app/"> في web/index.html أعلاه (خطوة
      # "تخصيص صفحة الويب الرئيسية"). خيار --base-href في أمر البناء يعمل
      # فقط عند وجود عنصر نائب $FLUTTER_BASE_HREF داخل الملف ليستبدله به —
      # وبما أننا كتبنا القيمة النهائية يدويًا بدل العنصر النائب، تمرير
      # الخيار يسبب فشل البناء بالخطأ:
      # "Couldn't find the placeholder for base href". لو تغيّر المسار
      # "/app/" مستقبلًا يجب تحديثه في مكانين: <base href> بالأعلى، وسطر
      # app.serveStaticAt('/app', ...) في server.js.
      - name: بناء نسخة الويب
        run: flutter build web --release

      # نضغط ناتج البناء في ملف واحد سهل التحميل والفكّ يدويًا على سيرفر
      # المستخدم (لا يوجد اتصال مباشر من GitHub Actions إلى سيرفر Windows
      # الخاص به، فالخطوة التالية تجهّز رابط تحميل ثابت بدل نشر تلقائي).
      - name: ضغط ناتج البناء في ملف واحد
        run: |
          cd build/web
          zip -r ../../sayanati-web.zip .

      # رابط تحميل مباشر وثابت لملف نسخة الويب المضغوط — يُحدَّث تلقائيًا مع
      # كل بناء جديد، بنفس أسلوب رابط تحميل الـ APK لكن بعلامة (tag) مختلفة
      # تمامًا (web-latest بدل apk-latest) حتى لا يتعارض مع نشر ملف الـ APK
      # الذي يعمل من ملف build-apk.yml المستقل عن هذا الملف.
      - name: نشر رابط تحميل ثابت لملف نسخة الويب
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-latest
          name: أحدث نسخة من نسخة الويب (PWA) لتطبيق صيانتي
          body: يُحدَّث تلقائيًا مع كل رفع كود جديد. حمّل sayanati-web.zip وفكّه داخل مجلد public-app بجانب مجلد public على سيرفر صيانتي، ثم أعد تشغيل الخدمة.
          make_latest: false
          files: sayanati-web.zip
